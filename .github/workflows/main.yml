name: Build WF1
on:
  push:
    branches:
      - main
  
  pull_request:
    branches:
      - main
  
  workflow_dispatch:

  schedule:
    - cron: "10 14 * * 1-5"    # Runs at 14:10, Monday to Friday

permissions:
  contents: read
jobs:
  Build:
    runs-on: ubuntu-latest
    steps:
      - name: Code checkout
        uses: actions/checkout@v4
        with: 
          fecth-depth: 0

      - name: Maven Build
        run: mvn install

      - name: Upload Build Artifact (WAR)
        uses: actions/upload-artifact@v4
        with:
          name: vprofile-app
          path: target/*.war

      - name: Notify if Build Fails
        if: failure()
        run: echo " Build job failed! Please check logs."


  Testing:
     runs-on: ubuntu-latest
     needs: Build
     steps:
       - name: Code checkout
         uses: actions/checkout@v4
         with: 
          fecth-depth: 0

       - name: Run test on main branch
         if: github.ref == 'refs/heads/main'
         run: mvn test

       - name: Checkstyle
         if: github.ref == 'refs/heads/main'
         run: mvn checkstyle:checkstyle

       - name: Run test on other branches
         if: github.ref != 'refs/heads/main'
         run: echo "Skipping unit test and code analysis"  

  Security_Scan:
     runs-on: ubuntu-latest
     needs: Build
     steps:
       - name: Code checkout
         uses: actions/checkout@v4
         with: 
          fecth-depth: 0

       - name: Run Trivy filesystem scan
         uses: aquasecurity/trivy-action@0.35.0
         with: 
          scan-type: 'fs'
          scan-ref: '.'
          format: json
          exit-code: 0
          vuln-type: os,library
          output: trivy-results.json

       - name: Upload Trivy scan results as artifact
         uses: actions/upload-artifact@v4
         with:
          name: trivy-scan-results
          path: trivy-results.json
