name: Build WF1
on:
  push:
    branches:
      - main
  
  pull_request:
    branches:
      - main
  
  workflow_dispatch:

  schedule:
    - cron: "10 14 * * 1-5"    # Runs at 14:10, Monday to Friday


jobs:
  Build:
    runs-on: ubuntu-latest
    steps:
      - name: Code checkout
        uses: actions/checkout@v4
        with: 
          fecth-depth: 0

      - name: Maven Build
        run: mvn install


  Testing:
     runs-on: ubuntu-latest
     needs: Build
     steps:
       - name: Code checkout
         uses: actions/checkout@v4
         with: 
          fecth-depth: 0

       - name: Run test on main branch
         run: mvn test

       - name: Checkstyle
         run: mvn checkstyle:checkstyle

